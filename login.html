<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Candidate Login and Registration for AI Mock Interview Simulator.">
    <title>Candidate Portal - AI Mock Interview Simulator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="index.html" class="logo">AI <span>Interview</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="setup.html">Practice</a></li>
            <li><a href="history.html">History</a></li>
            <li id="authNavContainer"><a href="login.html" class="btn-nav-auth">Sign In</a></li>
        </ul>
    </nav>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card">
            <h2 style="text-align: center; margin-bottom: 6px;">Candidate Portal</h2>
            <p style="text-align: center; color: var(--text-secondary); margin-bottom: 22px; font-size: 0.88rem;">
                Sign in to track interview scores, Gemini AI feedback, and progress history.
            </p>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab-btn active" id="tabLoginBtn" onclick="switchAuthTab('login')">Sign In</button>
                <button class="auth-tab-btn" id="tabRegisterBtn" onclick="switchAuthTab('register')">Register</button>
            </div>

            <div class="auth-alert" id="authAlert"></div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleAuthLogin(event)">
                <div class="form-group">
                    <label for="loginUsername">Username or Email</label>
                    <input type="text" id="loginUsername" placeholder="e.g. demo" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" id="loginSubmitBtn" style="width: 100%; margin-top: 8px;">
                    Sign In
                </button>
                <p style="font-size: 0.82rem; color: var(--text-muted); margin-top: 16px; text-align: center; font-family: var(--font-mono);">
                    Demo Account: demo / demo123
                </p>
            </form>

            <!-- Register Form -->
            <form id="registerForm" style="display: none;" onsubmit="handleAuthRegister(event)">
                <div class="form-group">
                    <label for="regFullName">Full Name</label>
                    <input type="text" id="regFullName" placeholder="e.g. Alex Smith" required>
                </div>
                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" placeholder="Choose username" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password (min 6 characters)</label>
                    <input type="password" id="regPassword" placeholder="••••••••" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary" id="regSubmitBtn" style="width: 100%; margin-top: 8px;">
                    Create Account
                </button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>AI Interview · PBL Web Technologies Project</p>
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
